services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped

    environment:
      POSTGRES_USER: zen
      POSTGRES_PASSWORD: zen_local_password
      POSTGRES_DB: zen_knowledge

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zen -d zen_knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: